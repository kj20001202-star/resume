<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小王个人简历</title>
<style>
  :root {
    --bg: #ffffff;
    --card-bg: #f5faff;
    --card-border: #d6e4f0;
    --card-shadow: 0 2px 8px rgba(160,196,232,0.3);
    --accent: #b3d9ff;
    --text: #333333;
    --heading-font: 'SimHei', '黑体', sans-serif;
    --body-font: 'Microsoft YaHei', '微软雅黑', sans-serif;
    --max-width: 800px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    line-height: 1.8;
  }

  .container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  /* 网站标题 */
  h1 {
    text-align: center;
    font-family: var(--heading-font);
    font-size: 28px;
    padding: 24px 0 30px;
    color: var(--text);
  }

  /* 模块卡片 */
  .section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    border-radius: 6px;
    padding: 24px 28px;
    margin-bottom: 20px;
  }

  .section h2 {
    font-family: var(--heading-font);
    font-size: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 16px;
    color: var(--text);
  }

  .section h3 {
    font-family: var(--heading-font);
    font-size: 15px;
    margin: 12px 0 8px;
    color: var(--text);
  }

  /* 基本信息：左文右图 */
  .basic-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }
  .basic-info .info-left { flex: 1; }
  .basic-info .info-left p { margin-bottom: 6px; }
  .basic-info .info-right { flex-shrink: 0; }
  .basic-info .info-right img {
    width: 150px;
    height: 200px;
    object-fit: cover;
    border-radius: 4px;
  }

  /* 经历条目 */
  .exp-item { margin-bottom: 14px; }
  .exp-item .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .exp-item .exp-header strong { font-size: 15px; }
  .exp-item .exp-header span { color: #888; font-size: 13px; }
  .exp-item p { font-size: 14px; color: #555; margin-top: 2px; }

  /* 技能证书四栏网格 */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .skills-grid .skill-item {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 8px 12px;
    text-align: center;
    font-size: 14px;
  }

  /* 荣誉奖项 ★ 列表 */
  .award-list { list-style: none; }
  .award-list li { margin-bottom: 6px; font-size: 14px; }
  .award-list li::before { content: '★ '; color: #f0a030; }

  /* 自我评价 */
  .self-eval {
    text-indent: 2em;
    text-align: justify;
    font-size: 14px;
    color: #555;
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .container { padding: 16px 12px 40px; }
    h1 { font-size: 24px; padding: 16px 0 20px; }
    .section { padding: 16px 14px; }
    .basic-info { flex-direction: column; align-items: center; }
    .basic-info .info-right img { width: 120px; height: 160px; }
    .skills-grid { grid-template-columns: repeat(2, 1fr); }
    .exp-item .exp-header { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ========== 网站标题 ========== -->
  <h1>小王个人简历</h1> <!-- 标题 -->

  <!-- ========== 一、基本信息 ========== -->
  <div class="section">

    <div class="basic-info">

      <div class="info-left">

        <p><strong>性别：</strong>男</p> <!-- 性别 -->

        <p><strong>学历：</strong>硕士研究生</p> <!-- 学历 -->

        <img src="photo.png" alt="小王"> <!-- 个人照片 -->

  <!-- ========== 四、实习经历 ========== -->

  <!-- ========== 五、校园工作经历 ========== -->

  </div>

  <!-- ========== 六、技能证书 ========== -->
  <div class="section">

    <div class="skills-grid">
      <div class="skill-item">大学英语四级 CET-4</div> <!-- 四级英语证书 -->
    </div>
  </div>

  <!-- ========== 七、荣誉奖项 ========== -->
  <div class="section">

    <ul class="award-list">
      <li>校园三等奖</li> <!-- 校园三等奖 -->

  </div>

  <!-- ========== 八、自我评价 ========== -->
  <div class="section">
    <h2>自我评价</h2>
    <p class="self-eval">（待补充）</p> <!-- 自我评价留空 -->
  </div>

</div>

</body>
</html>
